name: Flutter checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      # Existing info diagnostics remain visible. Warnings and errors fail CI.
      - name: Analyze (existing lint debt reported)
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Test local models and widgets
        run: flutter test --no-pub --concurrency=2
      - name: Compile web target
        run: flutter build web --no-pub
